aid: bloomberg-index-solutions-limited-bisl
name: Bloomberg Index Solutions Limited (BISL)
description: Bloomberg Index Solutions Limited (BISL) is the entity that administers Bloomberg's fixed income and
  multi-asset indices, including the Bloomberg Global Aggregate Bond Index and other benchmark indices. BISL provides
  index data, calculations, and licensing for asset managers and financial institutions using Bloomberg indices
  as benchmarks or for financial product construction.
